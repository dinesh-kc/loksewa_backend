{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1 class="display-4 fw-bold mb-4">Contact Us</h1>
            <div class="card border-0 shadow-sm">
                <div class="card-body p-5">
                    <p class="lead mb-4">Have questions, feedback, or suggestions? We'd love to hear from you!</p>
                    
                    <div class="row g-4 mb-5">
                        <div class="col-md-6">
                            <div class="text-center p-3 bg-light rounded-3">
                                <i class="bi bi-envelope-fill fs-1 text-primary"></i>
                                <h5 class="mt-2">Email</h5>
                                <p class="mb-0"><a href="mailto:dineshkc.mail@gmail.com" class="text-decoration-none">dineshkc.mail@gmail.com</a></p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="text-center p-3 bg-light rounded-3">
                                <i class="bi bi-clock-fill fs-1 text-primary"></i>
                                <h5 class="mt-2">Response Time</h5>
                                <p class="mb-0">Within 24-48 hours</p>
                            </div>
                        </div>
                    </div>
                    
                    <form method="post" action="/contact/">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Your Name</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Subject</label>
                            <input type="text" name="subject" class="form-control" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Message</label>
                            <textarea name="message" rows="5" class="form-control" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg px-5">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
